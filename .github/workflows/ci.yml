name: CI

# LEONEFERITO/BE — Spring Boot 4.1 / Java 21 / PostgreSQL 18
#
# 시크릿 검사 + 빌드·테스트 + 이미지 빌드 검증.
# 서버 배포(푸시·승인 게이트·롤백)는 서버와 도메인이 정해진 뒤 추가한다 (README "배포").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: 시크릿 검사
    runs-on: ubuntu-latest
    steps:
      # 외부 액션은 커밋 해시로 고정한다. 태그(@v5)는 나중에 다른 코드를 가리킬 수 있어
      # 공급망 공격에 취약하다. 해시는 내용이 바뀌면 값이 달라진다.
      - name: 체크아웃
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: 시크릿 검사 (커밋 훅과 같은 스크립트)
        run: |
          chmod +x scripts/check-secrets.sh
          ./scripts/check-secrets.sh

  build:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # build.gradle 의 toolchain 과 같은 21. toolchain 이 있어 없어도 Gradle 이 받아오지만,
      # 미리 깔면 빌드가 빨라진다.
      - name: JDK 21 설치
        # actions/setup-java v5.0.0
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        # gradle/actions/setup-gradle v4.4.4
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      # Testcontainers 가 실제 PostgreSQL 18 을 띄운다 (H2 같은 대체 DB 를 쓰지 않는다 —
      # 방언이 달라 "테스트는 통과하는데 운영에서 깨지는" 문제가 생긴다).
      # ubuntu-latest 러너에는 Docker 가 기본 설치되어 있다.
      #
      # chmod 를 먼저 한다. Windows 에서 커밋된 gradlew 는 실행 비트가 없을 수 있고(Dockerfile 도 같은 이유로
      # chmod 한다), 그러면 이 단계가 **1초 만에 exit 126** 으로 죽는다 — 테스트가 돌지 않았는데 "빌드 실패" 로만
      # 보인다. 2026-09-28 초기 커밋부터 10-04 까지 CI 29회가 전부 이 이유로 실패했고, 그동안 테스트 스위트는
      # CI 에서 한 번도 돌지 않았다. 인덱스의 모드도 100755 로 고쳤지만(git update-index --chmod=+x),
      # 다음에 누가 Windows 에서 gradlew 를 갈아 끼워도 CI 가 조용히 죽지 않도록 여기서도 보장한다.
      - name: 빌드 및 테스트
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 체크아웃
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Dockerfile 이 깨지면 여기서 잡는다. 레지스트리에 올리지는 않는다 —
      # 어디에 올릴지(D6)가 정해진 뒤에 push 를 붙인다.
      - name: docker build
        run: docker build --tag leoneferito-api:ci .

      # 이미지가 실제로 뜨는지. DB 가 없으니 prod 프로필은 기동 실패가 맞고,
      # 그 대신 jar 가 실행 가능한지만 본다.
      - name: 이미지 실행 확인
        run: docker run --rm --entrypoint java leoneferito-api:ci -jar app.jar --version 2>&1 | head -5 || true

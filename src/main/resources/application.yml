# LEONEFERITO API 설정
#
# 프로필 구조
#   local : 로컬 개발 (docker-compose 의 PostgreSQL 을 바라본다) — 기본값
#   prod  : 운영 (모든 접속 정보를 환경변수에서 읽는다. 없으면 기동 실패 = fail closed)
#
# 개인 설정을 덮어쓰려면 application-local.yml 을 만든다 (.gitignore 처리되어 있음).
# 시크릿은 이 파일에 적지 않는다. .env / 환경변수로만 넣는다.

spring:
  application:
    name: leoneferito-api

  profiles:
    # 프로필을 지정하지 않으면 local. 운영에서 프로필을 깜빡하면 로컬 DB 를 찾다가
    # 접속 실패로 기동이 멈춘다 — 잘못된 상태로 뜨는 것보다 낫다 (fail closed).
    default: local

  autoconfigure:
    exclude:
      # Spring Boot 는 UserDetailsService 빈이 없으면 기본 계정(user / 매번 새로 만든 비밀번호)을
      # 메모리에 만들고 비밀번호를 로그에 찍는다. 폼 로그인·Basic 을 꺼서 그 계정으로 들어올 길은
      # 없지만, 로그에 자격증명이 남는 것 자체가 문제다. 쓰지 않는 계정은 만들지 않는다.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  lifecycle:
    # graceful shutdown 이 기다리는 최대 시간. 이미지 업로드(10MB)가 끝날 만큼.
    timeout-per-shutdown-phase: 20s

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      # (create/update 로 두면 마이그레이션과 실제 스키마가 갈라진다)
      ddl-auto: validate
    # 뷰 렌더링 중 지연 로딩을 막는다. 끄지 않으면 N+1 이 조용히 숨는다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DB 에는 UTC 로 저장하고, 표시 시점에 한국 시간으로 바꾼다.
          # 서버 시간대에 따라 값이 흔들리는 문제를 원천 차단한다.
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 운영 DB 에 이미 테이블이 있는 상태로 붙는 사고를 막는다.
    baseline-on-migrate: false
    validate-on-migrate: true

  session:
    # 세션을 DB 에 둔다. 재배포해도 로그인이 풀리지 않고, 인스턴스를 늘려도 같은 세션을 본다.
    store-type: jdbc
    # 스키마의 주인은 Flyway 다 (V4). Spring Session 이 따로 만들지 않게 막는다.
    jdbc:
      initialize-schema: never
    # 30분 무활동이면 만료. 쇼핑 중 끊기지 않을 만큼 길고, 공용 PC 에 남지 않을 만큼 짧다.
    timeout: 30m

  servlet:
    multipart:
      # 파일 한 장 10MB. MediaService.MAX_BYTES 와 같은 값이어야 한다.
      # 이쪽은 요청을 다 받기 전에 끊고, 그쪽은 최종 확인이다 — 두 겹으로 둔다.
      max-file-size: 10MB
      # 요청 전체. 여러 장을 한 번에 올리는 경우를 위해 조금 더 크게.
      max-request-size: 12MB

app:
  media:
    # 업로드 이미지의 공개 기준 주소. 스토리지가 붙으면 CDN 주소로 바꾼다.
    base-url: ${MEDIA_BASE_URL:/media}
    # 업로드 바이트가 저장되는 곳. 인스턴스를 늘리기 전에 객체 스토리지로 옮겨야 한다.
    storage-dir: ${MEDIA_STORAGE_DIR:./media-store}
  cors:
    # 쿠키를 주고받으므로 * 를 쓸 수 없다. 허용 출처를 명시한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  front:
    # 간편 로그인이 끝난 뒤 브라우저를 돌려보낼 프론트 주소. 비밀번호 재설정 링크도 이 주소로 만든다.
    base-url: ${FRONT_BASE_URL:http://localhost:3000}
    # 프론트(정적 내보내기)를 다시 빌드하게 하는 Vercel 배포 훅. 상품 공개·수정이 손님 화면에 반영된다.
    # 비어 있으면 다시 빌드하지 않는다(로컬). 비밀이다 — 아는 사람은 누구나 빌드를 돌릴 수 있다.
    deploy-hook-url: ${FRONT_DEPLOY_HOOK_URL:}
    # 연달아 고친 것을 한 번의 빌드로 묶는 시간.
    rebuild-delay: 30s
  order:
    # 배송비(원). TODO(고객확인) 비어 있으면 주문을 받지 않는다 — 지어낸 배송비가 결제되면 안 된다.
    shipping-fee-krw: ${ORDER_SHIPPING_FEE_KRW:}
    # 이 금액 이상이면 배송비 0원. 비어 있으면 무료 배송 없음.
    free-shipping-threshold-krw: ${ORDER_FREE_SHIPPING_THRESHOLD_KRW:}
  auth:
    # 인증 주소의 IP 단위 요청 제한 (AuthRateLimitFilter).
    # 계정별 방어(로그인 잠금 · 재설정 메일 시간당 5회)는 계정을 바꿔가며 찍는 공격을 못 막는다.
    rate-limit:
      # 끄는 곳은 통합 테스트뿐이다 (src/test/resources). 운영·로컬에서 끄지 않는다.
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      # 로그인 · 관리자 로그인 — IP 당 "실패" 횟수. 성공은 세지 않는다.
      # 공유 IP(통신사 · 회사 NAT) 뒤의 정상 사용자가 서로의 한도를 먹지 않게 하려는 것이다.
      # 사람이 비밀번호를 30번 틀리는 일은 드물고, 스터핑은 수천 번을 원한다.
      credential-failures: ${AUTH_RATE_CREDENTIAL_FAILURES:30}
      # 가입 · 비밀번호 찾기 메일 — IP 당 전체 요청 수.
      # 이쪽은 실패가 신호가 아니다(재설정은 가입 여부를 숨기려고 언제나 202). 그래서 다 센다.
      costly-requests: ${AUTH_RATE_COSTLY_REQUESTS:10}
      # 창 길이. 창이 지나면 횟수가 0 으로 돌아간다.
      window: ${AUTH_RATE_WINDOW:10m}
      # 동시에 추적하는 출처 수의 상한 = 메모리 상한. 넘으면 지나간 창을 걷어내고,
      # 그래도 꽉 차 있으면 새 출처를 세지 않는다 — 메모리가 공격 수단이 되면 안 된다.
      max-tracked-clients: ${AUTH_RATE_MAX_TRACKED:50000}
  returns:
    # 교환·반품 신청 기간 (배송 완료일 다음 날부터). 기본값은 전자상거래법 제17조의 최소 기간이다 —
    # 이보다 짧게 넣어도 코드가 최소값으로 올린다(ReturnPolicy). TODO(고객확인) 더 길게 받을지.
    change-of-mind-days: ${RETURNS_CHANGE_OF_MIND_DAYS:7}
    seller-fault-months: ${RETURNS_SELLER_FAULT_MONTHS:3}
  payment:
    toss:
      # 토스페이먼츠 시크릿 키 (test_sk_… / live_sk_…). 비어 있으면 결제를 열지 않는다. 비밀값 — 로그에 찍지 않는다.
      secret-key: ${TOSS_SECRET_KEY:}
      api-base: https://api.tosspayments.com
  mail:
    # 보내는 사람. SMTP 서버가 이 주소로 보낼 권한이 있어야 한다(SPF/DKIM). TODO(고객확인) 발신 주소
    from: ${MAIL_FROM:LEONE FERITO <no-reply@leoneferito.com>}
  social:
    # 간편가입 제공자. client-id 가 비어 있으면 그 제공자는 꺼진다 —
    # 버튼이 안 나오고, 시작 주소로 들어와도 401 이다. 키 없이도 사이트는 뜬다.
    # 제공자 콘솔의 Redirect URI 에 {API 주소}/login/oauth2/code/kakao · /naver 를 등록한다.
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}

server:
  port: ${SERVER_PORT:8080}
  # 재배포 때 SIGTERM 을 받으면 새 요청은 거절하고 진행 중인 요청은 끝까지 처리한 뒤 내린다.
  # 없으면 업로드 중이던 요청이 잘린다. 기다리는 상한은 spring.lifecycle 에.
  shutdown: graceful
  # 에러 응답에 스택트레이스·메시지를 흘리지 않는다. 형식은 GlobalExceptionHandler 가 통일한다.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # 프록시(Caddy/ALB) 뒤에 서므로 X-Forwarded-* 를 신뢰한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 스크립트가 못 읽는다. XSS 가 나도 세션 쿠키는 가져갈 수 없다.
        http-only: true
        # 다른 사이트에서 시작된 요청에는 쿠키를 붙이지 않는다 (CSRF 1차 방어).
        # none 으로 내리지 않는다 — 그러려면 프론트와 API 가 같은 상위 도메인에 있어야 한다.
        same-site: lax
        # local 프로필에서는 http 로 개발하므로 아래에서 false 로 내린다.
        secure: true
        name: LFSESSION

management:
  health:
    mail:
      # 메일 서버 상태를 헬스체크에 넣지 않는다. 넣으면 메일 서버가 잠깐 죽었을 때
      # 준비 상태(readiness)가 DOWN 이 되어 사이트 전체가 트래픽에서 빠진다 —
      # 비밀번호 찾기 하나 때문에 쇼핑몰이 멈추는 셈이다. 메일 실패는 로그로 본다.
      enabled: false
  endpoints:
    web:
      exposure:
        # health 만 공개한다. env/beans/metrics 는 내부 정보가 새므로 열지 않는다.
        include: health
  endpoint:
    health:
      # 상세 정보는 인증된 요청에만. (Phase 5 에서 인증이 붙기 전까지는 사실상 비공개)
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.leoneferito: INFO

---
# ─────────────────────────────────────────────────────────────
# local — docker-compose 의 PostgreSQL. 이 자격증명은 localhost 전용 개발값이다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leoneferito}
    username: ${DB_USERNAME:leoneferito}
    password: ${DB_PASSWORD:leoneferito_local_only}
    driver-class-name: org.postgresql.Driver

  # 로컬 메일은 Mailpit(docker-compose)이 받는다. 실제로 나가지 않고 http://localhost:8025 에 보인다.
  # 운영은 SPRING_MAIL_HOST · SPRING_MAIL_PORT · SPRING_MAIL_USERNAME · SPRING_MAIL_PASSWORD 환경변수로 넣는다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  order:
    # ⚠️ 개발용 값이다. 고객 정책이 아니다 — 로컬에서 주문 흐름을 돌려 보려고 넣었다.
    # 운영(prod)에는 기본값이 없어서 ORDER_SHIPPING_FEE_KRW 를 넣기 전까지 주문을 받지 않는다.
    shipping-fee-krw: ${ORDER_SHIPPING_FEE_KRW:3000}

server:
  servlet:
    session:
      cookie:
        # 로컬은 http 라서 secure 쿠키가 브라우저에 저장되지 않는다. 여기서만 끈다.
        secure: false

logging:
  level:
    com.leoneferito: DEBUG
    # 개발 중 실행 SQL 확인용. 운영 프로필에는 없다.
    org.hibernate.SQL: DEBUG

---
# ─────────────────────────────────────────────────────────────
# prod — 기본값을 주지 않는다. 환경변수가 비면 기동이 실패해야 한다.
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.leoneferito: INFO

# 테스트 클래스패스에서만 읽힌다. 운영 설정(application.yml)은 그대로 두고 이 값만 **덧씌운다** —
# Spring Boot 는 application.properties 와 application.yml 을 둘 다 읽고, 겹치는 키는 properties 가 이긴다.
#
# IP 단위 요청 제한을 끈다. @SpringBootTest 들이 컨텍스트(= 필터 빈 = 메모리 카운터)를 공유해서,
# 켜 두면 가입 테스트 몇 개 뒤에 무관한 테스트가 401·202 대신 429 를 받는다. MockMvc 는 전부 127.0.0.1 이다.
# 필터 자체는 AuthRateLimitApiTest 가 @TestPropertySource 로 자기 컨텍스트에서 켜고 검증한다.
#
# bootTestRun(TestLeoneferitoApiApplication)도 이 파일을 읽으므로 거기서도 꺼진다 — 로컬 Testcontainers 개발용이라 괜찮다.
app.auth.rate-limit.enabled=false
